<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>iPhone 14 Pro · 早间科技情报预览</title>
<style>
:root{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#27352e;background:#e9eeeb;font-synthesis:none}
*{box-sizing:border-box}
body{margin:0;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.toolbar{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid #d6dfd9;background:#f7f9f7}
h1{margin:0;font-size:14px;font-weight:650}.dimensions{margin:3px 0 0;font-size:12px;color:#607168}
button{flex-shrink:0;font:inherit;font-size:12px;min-height:38px;padding:8px 12px;border:1px solid #cbd7cf;background:white;color:#28614b;border-radius:10px;cursor:pointer}
button:focus-visible{outline:3px solid #28614b;outline-offset:3px}
.stage{flex:1;min-height:0;display:grid;place-items:center;padding:20px 16px 12px}
.device-slot{position:relative;flex-shrink:0}
.phone{position:absolute;top:0;left:0;width:421px;height:880px;border:14px solid #151519;border-radius:64px;background:#151519;box-shadow:0 0 0 2px #77747d,0 0 0 4px #29272e,0 16px 38px #263d3228;transform-origin:top left}
.phone:before,.phone:after{content:"";position:absolute;left:-18px;width:4px;background:#45424a;border-radius:3px}
.phone:before{top:112px;height:26px}.phone:after{top:165px;height:72px}
.power{position:absolute;right:-18px;top:191px;width:4px;height:84px;background:#45424a;border-radius:3px}
.screen{position:relative;isolation:isolate;width:393px;height:852px;border-radius:50px;overflow:hidden;background:#f6f7f4;display:flex;flex-direction:column}
.statusbar{position:relative;flex:0 0 54px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;color:#17251c;user-select:none;font-size:15px;font-weight:650}
.island{position:absolute;left:50%;top:11px;transform:translateX(-50%);height:32px;width:120px;border-radius:20px;background:#050505}
.island:after{content:"";position:absolute;right:12px;top:10px;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#1d3045,#090e18 65%);border:1px solid #15191e}
.signals{display:flex;align-items:center;gap:5px}.signals svg{display:block}
iframe{display:block;width:393px;height:774px;min-height:0;flex:1;border:0;background:#f6f7f4}
.home{position:relative;flex:0 0 24px;background:#f6f7f4;pointer-events:none}
.home:after{content:"";position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:132px;height:5px;border-radius:4px;background:#18211d}
.hint{flex-shrink:0;text-align:center;margin:0;padding:0 16px 12px;font-size:12px;line-height:1.5;color:#607168}
@media(max-height:500px){.toolbar{padding:8px 14px}.stage{padding:12px}.hint{display:none}}
</style>
</head>
<body>
<header class="toolbar"><div><h1>iPhone 14 Pro</h1><p class="dimensions">393 × 852 · 竖屏预览</p></div><button id="reload" type="button">刷新页面</button></header>
<main class="stage" id="stage"><div class="device-slot" id="slot"><div class="phone" id="phone"><i class="power" aria-hidden="true"></i><div class="screen">
<div class="statusbar" aria-hidden="true"><span id="clock">9:41</span><span class="island"></span><span class="signals"><svg width="17" height="14" viewBox="0 0 17 14" fill="currentColor"><rect x="0" y="9" width="3" height="5" rx="1"/><rect x="5" y="6" width="3" height="8" rx="1"/><rect x="10" y="3" width="3" height="11" rx="1"/><rect x="15" width="2" height="14" rx="1"/></svg><svg width="17" height="14" viewBox="0 0 20 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M2 5Q10-2 18 5M5 8Q10 3 15 8M8 11Q10 9 12 11"/><circle cx="10" cy="14" r="1" fill="currentColor" stroke="none"/></svg><svg width="25" height="13" viewBox="0 0 27 14"><rect x="1" y="1" width="22" height="12" rx="3" fill="none" stroke="currentColor" opacity=".5"/><rect x="3" y="3" width="18" height="8" rx="1.5" fill="currentColor"/><path d="M25 5v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span></div>
<iframe id="site" src="../" title="早间科技情报，可在手机框内滚动和操作"></iframe>
<div class="home" aria-hidden="true"></div>
</div></div></div></main>
<p class="hint">在手机屏幕内滚动、点击，检查实际网页交互。</p>
<script>
const stage=document.querySelector('#stage'),slot=document.querySelector('#slot'),phone=document.querySelector('#phone');
function fitPhone(){
 const style=getComputedStyle(stage);
 const width=stage.clientWidth-parseFloat(style.paddingLeft)-parseFloat(style.paddingRight)-8;
 const height=stage.clientHeight-parseFloat(style.paddingTop)-parseFloat(style.paddingBottom)-8;
 const scale=Math.max(.1,Math.min(1,width/421,height/880));
 slot.style.width=421*scale+'px';slot.style.height=880*scale+'px';
 phone.style.transform='scale('+scale+')';
}
new ResizeObserver(fitPhone).observe(stage);
fitPhone();
document.querySelector('#reload').addEventListener('click',()=>document.querySelector('#site').contentWindow.location.reload());
function updateClock(){document.querySelector('#clock').textContent=new Intl.DateTimeFormat('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date())}
updateClock();setInterval(updateClock,60000);
</script>
</body>
</html>
